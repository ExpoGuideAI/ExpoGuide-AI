kind = "web"
previewPath = "/"
title = "ExpoGuide AI"
version = "1.0.0"
id = "artifacts/expo-guide"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23211

[services.development]
run = "pnpm --filter @workspace/expo-guide run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/expo-guide", "run", "build" ]
serve = "static"
publicDir = "artifacts/expo-guide/dist/public"

[services.production.build.env]
NODE_ENV = "production"
PORT = "23211"
BASE_PATH = "/"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23211"
BASE_PATH = "/"
